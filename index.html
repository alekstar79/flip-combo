<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Flip Combo</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #06060f;
      color: #f0f0f5;
      overflow: hidden;
      user-select: none;
    }

    /* Scene */

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .scene__bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(59, 130, 246, 0.18), transparent 55%),
        radial-gradient(ellipse at 80% 90%, rgba(139, 92, 246, 0.18), transparent 55%),
        linear-gradient(180deg, #0a0a1f 0%, #06060f 100%);
    }

    .scene__grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 90%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 90%);
    }

    /* Blobs (to demonstrate transparency) */

    .scene__blob {
      position: absolute;
      display: block;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.55;
      will-change: transform;
      pointer-events: none;
    }

    .scene__blob--blue {
      width: 560px; height: 560px;
      background: #2563eb;
      top: -180px; left: -120px;
      animation: drift-a 24s ease-in-out infinite;
    }

    .scene__blob--purple {
      width: 500px; height: 500px;
      background: #7c3aed;
      bottom: -180px; right: -100px;
      animation: drift-b 28s ease-in-out infinite;
    }

    .scene__blob--cyan {
      width: 420px; height: 420px;
      background: #06b6d4;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: drift-c 32s ease-in-out infinite;
    }

    @keyframes drift-a {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(80px, 60px); }
    }
    @keyframes drift-b {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(-60px, -80px); }
    }
    @keyframes drift-c {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-40%, -60%) scale(1.15); }
    }

    /* Hero */

    .scene__hero {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      max-width: 90vw;
      padding: 0 24px;
      pointer-events: none;
    }

    .scene__title {
      margin: 0;
      font-size: clamp(56px, 9vw, 128px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff 0%, #64748b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .scene__sep {
      color: #82b1ff;
      -webkit-text-fill-color: #82b1ff;
      font-weight: 400;
      margin: 0 0.05em;
    }

    .scene__subtitle {
      margin: 20px 0 0;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgba(240, 240, 245, 0.4);
      text-transform: uppercase;
    }

    /* Panels (glassmorphism) */

    .panel {
      position: absolute;
      min-width: 180px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      font-size: 12px;
      pointer-events: none;
    }

    .panel--tl { top: 24px; left: 24px; }
    .panel--tr { top: 24px; right: 24px; }
    .panel--bl { bottom: 24px; left: 24px; }
    .panel--br { bottom: 24px; right: 24px; }

    .panel__head {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(240, 240, 245, 0.4);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .panel__list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .panel__item {
      padding: 4px 8px;
      border-radius: 6px;
      color: rgba(240, 240, 245, 0.75);
      font-weight: 500;
    }

    .panel__item--active {
      background: rgba(130, 177, 255, 0.15);
      color: #82b1ff;
    }

    .panel__stat {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 6px;
    }

    .panel__stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #f0f0f5;
    }

    .panel__stat-label {
      font-size: 11px;
      color: rgba(240, 240, 245, 0.4);
    }

    .panel__row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      color: rgba(240, 240, 245, 0.6);
    }

    .panel__row strong {
      color: #f0f0f5;
      font-weight: 600;
    }

    .panel__row--muted {
      color: rgba(240, 240, 245, 0.35);
      font-size: 11px;
    }

    /* Toolbar */

    .toolbar {
      position: absolute;
      top: 50%; left: 24px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .toolbar__btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      color: rgba(240, 240, 245, 0.6);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: default;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .toolbar__btn:hover {
      background: rgba(130, 177, 255, 0.15);
      color: #82b1ff;
    }

    /* Hint */

    .scene__hint {
      position: absolute;
      bottom: 32px; left: 50%;
      transform: translateX(-50%);
      margin: 0;
      font-size: 13px;
      color: rgba(240, 240, 245, 0.4);
      animation: pulse 2.4s ease-in-out infinite;
      pointer-events: none;
      white-space: nowrap;
    }

    .scene__hint-key {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 5px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: #82b1ff;
      margin-right: 4px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 0.8; }
    }

    /* Responsive */

    @media (max-width: 720px) {
      .panel--tl, .panel--bl, .toolbar, .scene__hint { display: none; }
      .scene__title { font-size: clamp(40px, 12vw, 64px); }
    }

    /* App root */

    #app {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    #app .flipper {
      pointer-events: auto;
    }
  </style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="scene__bg"></div>
  <div class="scene__grid"></div>

  <span class="scene__blob scene__blob--blue"></span>
  <span class="scene__blob scene__blob--purple"></span>
  <span class="scene__blob scene__blob--cyan"></span>

  <header class="scene__hero">
    <h1 class="scene__title">
      flip<span class="scene__sep">·</span>combo
    </h1>
    <p class="scene__subtitle">
      Vanilla TypeScript · framework-agnostic · zero dependencies
    </p>
  </header>

  <aside class="panel panel--tl">
    <header class="panel__head">Layers</header>
    <ul class="panel__list">
      <li class="panel__item panel__item--active">background</li>
      <li class="panel__item">skewed panel</li>
      <li class="panel__item">active</li>
      <li class="panel__item">border1</li>
      <li class="panel__item">profile1</li>
    </ul>
  </aside>

  <aside class="panel panel--tr">
    <header class="panel__head">Canvas</header>
    <div class="panel__stat">
      <span class="panel__stat-value">1 590</span>
      <span class="panel__stat-label">× 400 px</span>
    </div>
    <div class="panel__row"><span>zoom</span><strong>82 %</strong></div>
  </aside>

  <aside class="panel panel--bl">
    <header class="panel__head">Cursor</header>
    <div class="panel__row"><span>x</span><strong>1285</strong></div>
    <div class="panel__row"><span>y</span><strong>526</strong></div>
  </aside>

  <aside class="panel panel--br">
    <header class="panel__head">Widget</header>
    <div class="panel__row"><span>Last subscriber</span></div>
    <div class="panel__row panel__row--muted"><span>Font · Casper</span></div>
  </aside>

  <nav class="toolbar">
    <button class="toolbar__btn" type="button" tabindex="-1">✎</button>
    <button class="toolbar__btn" type="button" tabindex="-1">T</button>
    <button class="toolbar__btn" type="button" tabindex="-1">◆</button>
    <button class="toolbar__btn" type="button" tabindex="-1">◫</button>
    <button class="toolbar__btn" type="button" tabindex="-1">↻</button>
    <button class="toolbar__btn" type="button" tabindex="-1">⌘</button>
  </nav>

  <p class="scene__hint">
    <span class="scene__hint-key">Scroll</span>
    over the widget to change its opacity
  </p>
</div>

<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
